<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>mockup: type to say hi</title>
<link rel="stylesheet" href="tokens.css" />
<style>
  body { min-height: 100vh; overflow-x: hidden; }
  .scene { position: relative; height: 1000px; display: flex; flex-direction: column; align-items: center; padding-top: 70px; }

  /* the wormhole, approximated for the mockup (the live site keeps its animated canvas) */
  .hole { position: absolute; left: 50%; bottom: -40px; width: 1500px; height: 560px; transform: translateX(-50%); pointer-events: none; }
  .hole svg { width: 100%; height: 100%; }
  .hole::after { content: ''; position: absolute; left: 50%; top: 18%; width: 520px; height: 300px; transform: translateX(-50%); background: radial-gradient(closest-side, rgba(255, 0, 170, 0.55), rgba(140, 0, 255, 0.18) 60%, transparent); filter: blur(10px); }

  .display { position: relative; z-index: 3; width: 820px; padding: 18px 22px 16px; background: #050505; border-radius: 18px; box-shadow: 0 0 0 1px rgba(255,255,255,0.07), 0 0 60px rgba(255, 0, 170, 0.12); }
  .display svg { width: 100%; height: auto; display: block; }
  .display .under { display: flex; justify-content: space-between; margin-top: 10px; }

  .board-wrap { position: relative; z-index: 2; margin-top: 64px; perspective: 1400px; }
  .board {
    transform: rotateX(46deg) rotateZ(-2deg);
    transform-style: preserve-3d;
    padding: 18px 20px 22px;
    border-radius: 22px;
    background: linear-gradient(180deg, #2a2a2e, #161618);
    box-shadow: 0 2px 0 #3a3a3f inset, 0 26px 0 #0d0d0f, 0 60px 120px rgba(255, 0, 170, 0.35), 0 0 0 1px rgba(255,255,255,0.05);
    animation: bob 5.5s ease-in-out infinite;
  }
  @keyframes bob { 50% { transform: rotateX(46deg) rotateZ(-2deg) translateZ(14px); } }
  .kb-row { display: flex; gap: 6px; margin-bottom: 6px; }
  .k {
    --w: 1;
    width: calc(var(--w) * 48px + (var(--w) - 1) * 6px);
    height: 48px;
    border-radius: 9px;
    background: #cfccc6;
    box-shadow: 0 5px 0 #9e9a93;
    position: relative;
    font-family: var(--mono);
    font-size: 11px;
    color: #36342f;
    display: flex; align-items: flex-start; justify-content: flex-start;
    padding: 6px 8px;
    transition: transform 80ms, box-shadow 80ms, background 300ms;
  }
  .k::before { content: ''; position: absolute; inset: 3px 4px 7px; border-radius: 7px; background: linear-gradient(#fbfaf7, #e7e4de); }
  .k span { position: relative; }
  .k.mod { background: #3a3a3f; box-shadow: 0 5px 0 #18181b; color: #c9c9cc; }
  .k.mod::before { background: linear-gradient(#4a4a50, #3a3a3f); }
  .k.accent { background: #c4007f; box-shadow: 0 5px 0 #6d0047; color: #2a0019; }
  .k.accent::before { background: linear-gradient(#ff5ccb, #ff1fb4); }
  .k.lit { transform: translateY(4px); box-shadow: 0 1px 0 #9e9a93, 0 0 26px rgba(255, 0, 170, 0.85); }
  .k.lit::before { background: linear-gradient(#ffd6f0, #ff8fd8); }

  .contact { margin-top: 18px; padding-top: 18px; border-top: 1px solid rgba(255,255,255,0.07); display: grid; grid-template-columns: 1fr auto; grid-template-areas: 'lamps actions' 'note actions'; gap: 8px 24px; align-items: center; }
  .contact .lamps { grid-area: lamps; }
  .contact p { grid-area: note; }
  .contact .actions { grid-area: actions; }
  .lamps { display: flex; gap: 28px; font-family: var(--mono); font-size: 14px; }
  .lamp { display: inline-flex; align-items: center; gap: 10px; }
  .lamp i { width: 10px; height: 10px; border-radius: 50%; background: #333; display: inline-block; }
  .lamp.on i { background: var(--signal); box-shadow: 0 0 12px var(--signal); }
  .lamp.off { color: var(--ash); }
  .contact p { color: var(--ash); max-width: 52ch; line-height: 1.55; font-size: 14px; }
  .actions { display: flex; gap: 12px; }
  .btn { font-family: var(--mono); font-size: 14px; color: var(--bone); background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.12); border-radius: 999px; padding: 11px 18px; text-decoration: none; display: inline-flex; gap: 10px; align-items: center; }
  .btn.primary { background: var(--signal); border-color: var(--signal); color: #1a0010; box-shadow: 0 0 24px rgba(255,0,170,0.45); }
  .btn kbd { font-family: var(--mono); font-size: 12px; padding: 1px 6px; border-radius: 5px; background: rgba(0,0,0,0.18); }
</style>
</head>
<body class="grid-bg">
<span class="mock-tag">mockup b: type to say hi (replaces the temp keyboard + button)</span>
<div class="scene">
  <div class="display">
    <svg id="led"></svg>
    <div class="under"><span class="label">type anything. it goes straight to my inbox.</span><span class="label" id="chars">29 / 280</span></div>
  <div class="contact">
    <div class="lamps">
      <span class="lamp on"><i></i>inbox open</span>
      <span class="lamp off"><i></i>bench full</span>
    </div>
    <p>i'm not taking builds right now, but i read every message. if your idea is one i'd want to build, i'll tell you.</p>
    <div class="actions">
      <a class="btn primary" href="#">send as email <kbd>enter</kbd></a>
      <a class="btn" href="#">dm @kaushrajesh</a>
    </div>
  </div>
  </div>

  <div class="board-wrap"><div class="board" id="board"></div></div>


  <div class="hole"><svg id="hole" viewBox="0 0 1500 560" preserveAspectRatio="none"></svg></div>
</div>

<script type="module">
import { drawText } from './dots.js';

const rows = [
  ['esc:mod','1','2','3','4','5','6','7','8','9','0','-','=','⌫:mod:2'],
  ['tab:mod:1.5','q','w','e','r','t','y','u','i','o','p','[',']','\\:mod:1.5'],
  ['caps:mod:1.75','a','s','d','f','g','h','j','k','l',';',"'",'enter:accent:2.25'],
  ['shift:mod:2.25','z','x','c','v','b','n','m',',','.','/','shift:mod:1.75','↑:mod'],
  ['ctrl:mod:1.25','alt:mod:1.25','cmd:mod:1.25',' :none:6.25','cmd:mod','←:mod','↓:mod','→:mod'],
];
const board = document.getElementById('board');
const byKey = {};
rows.forEach((r) => {
  const row = document.createElement('div'); row.className = 'kb-row';
  r.forEach((spec) => {
    const [label, kind = '', w = '1'] = spec.split(':');
    const k = document.createElement('div');
    k.className = 'k' + (kind && kind !== 'none' ? ' ' + kind : '');
    k.style.setProperty('--w', w);
    k.innerHTML = `<span>${label.trim()}</span>`;
    byKey[label === ' ' ? ' ' : label] = k;
    row.appendChild(k);
  });
  board.appendChild(row);
});

// wormhole rings
const svg = document.getElementById('hole');
const ns = 'http://www.w3.org/2000/svg';
for (let i = 0; i < 26; i++) {
  const p = i / 26, e = document.createElementNS(ns, 'ellipse');
  const ease = Math.pow(2, 10 * p - 10);
  e.setAttribute('cx', 750); e.setAttribute('cy', 150 + 300 * ease);
  e.setAttribute('rx', 740 * (1 - p)); e.setAttribute('ry', 170 * (1 - p));
  e.setAttribute('fill', 'none'); e.setAttribute('stroke', `rgba(${180 + 75 * p}, 40, ${200 + 55 * p}, ${0.18 + p * 0.6})`); e.setAttribute('stroke-width', 1.4);
  svg.appendChild(e);
}
for (let i = 0; i < 64; i++) {
  const a = (i / 64) * Math.PI * 2, l = document.createElementNS(ns, 'line');
  l.setAttribute('x1', 750 + Math.cos(a) * 740); l.setAttribute('y1', 150 + Math.sin(a) * 170);
  l.setAttribute('x2', 750 + Math.cos(a) * 40); l.setAttribute('y2', 440 + Math.sin(a) * 9);
  l.setAttribute('stroke', 'rgba(200, 40, 230, 0.16)'); l.setAttribute('stroke-width', 1);
  svg.appendChild(l);
}

// typed state for the screenshot
const typed = "hi kaush, could you build me_";
const cols = 88;
const total = drawText(document.getElementById('led'), typed, { cols, gap: 8.2 });
drawText(document.getElementById('led'), typed, { cols, gap: 8.2, offset: Math.max(0, total - cols) });
['m', 'e', ' '].forEach((key) => byKey[key]?.classList.add('lit'));
</script>
</body>
</html>
